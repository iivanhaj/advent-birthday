[package]
name = "bloom"
version = "0.1.0"
edition = "2021"
description = "Door 5: walks the infinitely nested flower and returns the visible flowers (compiled to WebAssembly)"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
